[package]
name = "here-for-work"
version = "0.1.0"
description = "A local-first job search and application preparation companion"
authors = ["HereForWork"]
edition = "2024"
rust-version = "1.85"
default-run = "here-for-work"

[lib]
name = "here_for_work_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
rusqlite = { version = "0.37.0", features = ["bundled", "backup"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.10.2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.18"
uuid = { version = "1.22.0", features = ["v4", "serde"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.26.0"
